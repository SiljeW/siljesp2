<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PETsome - Find Your Perfect Pet</title>
  <link href="./src/style.css" rel="stylesheet">
</head>
<body class="bg-white min-h-screen">
  <!-- Header/Navigation -->
  <header class="bg-white px-20 py-14 shadow-sm">
    <div class="container mx-auto flex justify-between items-center">
      <div class="flex items-center">
        <!-- Logo -->
        <div class="flex items-center">
          <img src="assets/images/PetsomeLogo.png" width="381" height="160" alt="PETsome Logo" class="w-[381px] h-[160px]">
        </div>
      </div>
      
      <!-- Auth Buttons -->
      <div class="space-x-4">
        <a href="/account/login.html" class="inline-block px-6 py-2 bg-primary text-white rounded hover:underline transition">Login</a>
        <a href="/account/register.html" class="inline-block px-6 py-2 bg-primary text-white rounded hover:underline transition">Sign Up</a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="container mx-auto py-16 flex justify-center">
    <div class="flex auto">
      <img src="assets/images/Petsomecatdog.png" width="461" height="300" alt="Petsome Cat and dog">
    </div>
  </section>

  <!-- Pet Listings Section -->
  <section class="bg-purple-100 py-10">

      <div class="flex justify-between items-center mb-8">

        <a href="/pets" class="inline-flex items-center px-4 py-2 bg-gray-900 text-white rounded hover:underline transition">
          See all listings

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>
      </div>

        <div class="bg-white rounded-md overflow-hidden shadow-sm">

          </div>
        </div>
        
        <!-- Pet Card 2 -->
        <div class="bg-white rounded-md overflow-hidden shadow-sm">
          <h3 class="p-4 text-center font-medium">Lorem Ipsum...</h3>

            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />

            <a href="#" class="px-6 py-2 bg-secondary text-white rounded hover:underline transition">View More</a>
          </div>
        </div>
        
        <!-- Pet Card 3 -->
        <div class="bg-white rounded-md overflow-hidden shadow-sm">
          <h3 class="p-4 text-center font-medium">Lorem Ipsum...</h3>

            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">

            <a href="#" class="px-6 py-2 bg-secondary text-white rounded hover:underline transition">View More</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Admin CTA Section -->
  <section class="container mx-auto py-8">
    <div class="flex justify-center items-center space-x-4">
      <h2 class="text-2xl font-semibold text-gray-800">Want to join as admin?</h2>
      <a href="/account/register" class="px-6 py-2 bg-secondary text-white rounded hover:underline transition">Sign Up</a>
    </div>
  </section>
