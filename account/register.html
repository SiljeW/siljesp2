<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PETsome - Register Page</title>
  <link href="../src/style.css" rel="stylesheet">
</head>
<body class="bg-white min-h-screen">
  <header class="bg-white px-20 py-14 shadow-sm">
    <div class="container mx-auto flex justify-between items-center">
      <div class="flex items-center">
        <div class="flex items-center">
          <img src="../assets/images/PetsomeLogo.png" width="381" height="160" alt="PETsome Logo" class="w-[381px] h-[160px]">
        </div>
      </div>
      <div class="space-x-4">
        <a href="/account/login" class="inline-block px-6 py-2 bg-primary text-white rounded hover:underline transition">Login</a>
        <a href="/account/register" class="inline-block px-6 py-2 bg-primary text-white rounded hover:underline transition">Sign Up</a>
      </div>
      <div class="hidden" id="user-menu">
        <span id="user-name" class="mr-2">User Name</span>
        <button id="logout-button" class="text-red-600 hover:text-red-800">Logout</button>
      </div>
    </div>
    <button id="mobile-menu-button" aria-expanded="false" class="md:hidden focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-primary-dark" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <div class="hidden md:block">
      <div id="guest-nav" class="space-x-4">
        <a href="/account/login" class="inline-block px-6 py-2 bg-primary text-white rounded hover:underline transition">Login</a>
        <a href="/account/register" class="inline-block px-6 py-2 bg-primary text-white rounded hover:underline transition">Sign Up</a>
      </div>
      <div id="user-nav" class="hidden">
        <div class="relative">
          <button id="profile-dropdown-button" class="flex items-center px-4 py-2 rounded-full bg-gray-100 hover:bg-gray-200 transition">
            <div class="mr-2 w-8 h-8 bg-primary-dark rounded-full flex items-center justify-center text-white">
              <span id="user-initials">US</span>
            </div>
            <span id="user-name-display" class="mr-2 font-medium">User</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          <div id="profile-dropdown" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-10 hidden">
            <a href="/listings" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition">
              Listings
            </a>
            <a href="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition">
              My Profile
            </a>
            <hr class="my-1 border-gray-200">
            <button id="logout-btn" class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100 transition">
              Logout
            </button>
          </div>
        </div>
      </div>
    </div>
    <div id="mobile-menu" class="md:hidden hidden mt-4">
      <div id="mobile-guest-nav" class="flex flex-col space-y-2 py-4">
        <a href="/account/login" class="px-6 py-2 bg-primary text-white rounded hover:underline transition">Login</a>
        <a href="/account/register" class="px-6 py-2 bg-primary text-white rounded hover:underline transition">Sign Up</a>
      </div>
      <div id="mobile-user-nav" class="hidden">
        <div class="flex flex-col items-center space-y-2 py-4">
          <div class="w-8 h-8 bg-primary-dark rounded-full flex items-center justify-center text-white">
            <span id="mobile-user-initials">US</span>
          </div>
          <span id="mobile-user-name" class="ml-2 font-medium">User</span>
        </div>
        <a href="/listings" class="px-6 py-2 hover:bg-gray-100 transition rounded">Listings</a>
        <a href="/profile" class="px-6 py-2 hover:bg-gray-100 transition rounded">My Profile</a>
        <button id="mobile-logout-btn" class="text-left px-6 py-2 text-red-600 hover:bg-gray-100 transition rounded">
          Logout
        </button>
      </div>
    </div>
  </header>
  <main class="container mx-auto flex justify-center items-center py-12">
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Login</h1>
      <div id="register-error" class="hidden mb-4 p-4 bg-red-100 text-red-700 rounded"></div>
      <form id="register-form" class="space-y-6">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Name</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            required 
            class="w-full px-4 py-2 border border-gray-200 rounded-md bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="Name..."
          >
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            class="w-full px-4 py-2 border border-gray-200 rounded-md bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="Email..."
          >
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            class="w-full px-4 py-2 border border-gray-200 rounded-md bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="Password..."
          >
        </div>
        <div>
          <button 
            type="submit" 
            class="w-full py-3 px-4 bg-primary-dark text-white rounded-md hover:bg-purple-900 transition"
          >
            Register
          </button>
        </div>
        <div class="text-center mt-4">
          <p class="text-sm text-gray-600">
            Already have an account? <a href="/account/login" class="text-primary hover:underline">Login!</a>
          </p>
        </div>
      </form>
    </div>
  </main>
  <footer class="bg-gray-900 text-white px-20 py-8">
    <div class="container mx-auto px-4">
      <div class="flex flex-col md:flex-row justify-between">
        <div class="space-y-4 mb-6 md:mb-0">
          <a href="/contact" class="block hover:text-gray-300">Contact us</a>
          <a href="/about" class="block hover:text-gray-300">About</a>
          <a href="/faq" class="block hover:text-gray-300">FAQ</a>
        </div>
        <div class="flex justify-center space-x-6 mb-6 md:mb-0">
          <a href="#" class="text-white hover:text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
          </a>
          <a href="#" class="text-white hover:text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"/>
            </svg>
          </a>
          <a href="#" class="text-white hover:text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M4.98 3.5c0 1.381-1.11 2.5-2.48 2.5s-2.48-1.119-2.48-2.5c0-1.38 1.11-2.5 2.48-2.5s2.48 1.12 2.48 2.5zm.02 4.5h-5v16h5v-16zm7.982 0h-4.968v16h4.969v-8.399c0-4.67 6.029-5.052 6.029 0v8.399h4.988v-10.131c0-7.88-8.922-7.593-11.018-3.714v-2.155z"/>
            </svg>
          </a>
        </div>
        <div class="space-y-4">
          <a href="/privacy" class="block hover:text-gray-300">Privacy Policy</a>
          <a href="/terms" class="block hover:text-gray-300">Terms & Conditions</a>
        </div>
      </div>
    </div>
  </footer>
  <script type="module" src="../src/js/pages/auth/register.js"></script>
</body>
</html>
