<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PETsome - Pet Details</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="min-h-screen flex flex-col bg-white">
  <header class="bg-white p-4 flex justify-between items-center">
    <div class="flex items-center">
      <img src="./assets/images/PetsomeLogo.png" alt="PETsome Logo" class="w-[60px] h-[60px] rounded-full">
      <span class="ml-2 font-bold text-[#362550]">PETsome</span>
    </div>
    <button class="text-gray-700">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
    </button>
  </header>
  <div class="container mx-auto px-4 mt-4">
    <a href="profile.html" class="text-gray-700 inline-flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Back to My Listings
    </a>
  </div>
  <main class="container mx-auto px-4 flex-1">
    <h1 id="pet-name" class="text-xl font-bold mt-4">Loading...</h1>
    <div class="mt-4 bg-gray-100 rounded-md overflow-hidden">
      <div id="main-image" class="flex items-center justify-center py-8">
        <div class="animate-pulse w-64 h-48 bg-gray-300"></div>
      </div>
    </div>
    <div id="thumbnail-images" class="grid grid-cols-3 gap-4 mt-4">
      <div class="animate-pulse bg-gray-200 p-2 rounded-md h-24"></div>
      <div class="animate-pulse bg-gray-200 p-2 rounded-md h-24"></div>
      <div class="animate-pulse bg-gray-200 p-2 rounded-md h-24"></div>
    </div>
    <div class="border-t border-gray-200 mt-4 pt-2">
      <div id="pet-details" class="flex justify-between text-sm">
        <div>Breed: <span id="pet-breed">Loading...</span></div>
        <div>Age: <span id="pet-age">Loading...</span></div>
        <div>Size: <span id="pet-size">Loading...</span></div>
      </div>
    </div>
    <div class="mt-6">
      <h2 class="font-bold">Description:</h2>
      <p id="pet-description" class="mt-2 text-sm text-gray-700">
        Loading...
      </p>
    </div>
  </main>
  <footer class="bg-[#192231] text-white py-6 mt-8">
    <div class="container mx-auto px-4">
      <div class="grid grid-cols-2">
        <div class="space-y-2">
          <div>Contact us</div>
          <div>About</div>
          <div>FAQ</div>
        </div>
        <div class="flex justify-end items-start space-x-4">
          <div class="flex space-x-4">
            <a href="#" class="text-white">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
              </svg>
            </a>
            <a href="#" class="text-white">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"/>
              </svg>
            </a>
            <a href="#" class="text-white">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M4.98 3.5c0 1.381-1.11 2.5-2.48 2.5s-2.48-1.119-2.48-2.5c0-1.38 1.11-2.5 2.48-2.5s2.48 1.12 2.48 2.5zm.02 4.5h-5v16h5v-16zm7.982 0h-4.968v16h4.969v-8.399c0-4.67 6.029-5.052 6.029 0v8.399h4.988v-10.131c0-7.88-8.922-7.593-11.018-3.714v-2.155z"/>
              </svg>
            </a>
          </div>
        </div>
      </div>
      <div class="text-right mt-2">
        <div>Privacy Policy</div>
        <div>Terms & Conditions</div>
      </div>
    </div>
  </footer>

  <!-- Mobile Navigation Bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-4">
    <a href="index.html" class="text-gray-600 flex flex-col items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
    </a>
    <a href="search.html" class="text-gray-600 flex flex-col items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </a>
    <a href="new-listing.html" class="text-green-600 flex flex-col items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
    </a>
    <a href="profile.html" class="text-gray-600 flex flex-col items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
      </svg>
    </a>
    <a href="profile.html" class="text-gray-600 flex flex-col items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    </a>
  </div>
  <script type="module" src="./js/pet-detail.js"></script>
</body>
</html>
