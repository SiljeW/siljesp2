<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PETsome - Profile Page</title>
  <link href="./src/style.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body class="bg-white min-h-screen">
  <header class="bg-white px-6 md:px-20 py-6 md:py-14 shadow-sm">  
    <div class="container mx-auto flex justify-between items-center">
      <div class="flex items-center">
        <div class="flex items-center">
          <img src="/assets/images/PetsomeLogo.png" width="300" height="160" alt="PETsome Logo" class="w-40 md:w-[381px] h-auto md:h-[160px]">
        </div>
      </div>
      <button id="mobile-menu-button" aria-expanded="false" class="block md:hidden focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-primary-dark" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <button id="mobile-menu-button-loggedin" aria-expanded="false" class="hidden md:hidden focus:outline-none">
        <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-primary-dark">
          <div class="flex items-center justify-center text-primary-dark font-semibold">
            <span class="material-symbols-outlined icon-medium" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;">
              face
            </span>
          </div>
        </div>
      </button>
      <div class="hidden md:block">
        <div id="auth-buttons" class="space-x-4">
          <a href="/login.html" class="inline-block px-6 py-2 bg-primary text-white rounded hover:underline transition">Login</a>
          <a href="/register.html" class="inline-block px-6 py-2 bg-primary text-white rounded hover:underline transition">Sign Up</a>
        </div>
        <div id="user-menu" class="hidden">
          <div class="relative">
            <button id="profile-button" class="flex items-center focus:outline-none">
              <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-primary-dark">
                <div class="flex items-center justify-center text-primary-dark font-semibold">
                  <span class="material-symbols-outlined icon-large" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;">
                    face
                  </span>
                </div>
              </div>
            </button>
            <div id="profile-dropdown" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-10 hidden">
              <a href="/profile.html" class="flex self-end px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition">
                My Profile
              </a>
              <a href="/listings.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition">
                Listings
              </a>
              <button id="logout-button" class="block text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition w-full">
                Log out
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="mobile-menu" class="hidden md:hidden mt-4">
      <div id="mobile-auth-buttons" class="flex flex-col space-y-2 py-4">
        <a href="/login.html" class="px-6 py-2 bg-primary text-white rounded hover:underline transition">Login</a>
        <a href="/register.html" class="px-6 py-2 bg-primary text-white rounded hover:underline transition">Sign Up</a>
      </div>
      <div id="mobile-user-menu" class="hidden py-4">
        <div class="flex items-end px-2 py-2">
          <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-dark">
            <div class="w-full h-full bg-primary-dark flex items-end justify-center text-white text-lg font-semibold">
              <span id="mobile-user-initials">U</span>
            </div>
          </div>
          <span id="mobile-user-name" class="ml-2 font-medium">User</span>
        </div>
        <div class="flex flex-col items-end space-y-2 mt-2">
          <a href="/profile.html" class="flex self-end px-6 py-2 hover:bg-gray-100 transition rounded">My Profile</a>
          <a href="/listings.html" class="px-6 py-2 hover:bg-gray-100 transition rounded">Listings</a>
          <button id="mobile-logout-button" class="text-left px-6 py-2 text-gray-700 hover:bg-gray-100 transition rounded">
            Log out
          </button>
        </div>
      </div>
    </div>
  </header>
  <main class="flex-col justify-center items-center py-12">
    <div class="flex items-center mb-8">
      <img src="/assets/images/profile.jpg" alt="Profile picture" class="w-16 h-16 rounded-full">
      <div class="ml-4">
        <h1 class="text-2xl font-bold">My Pet Listings</h1>
        <p class="text-gray-600">Manage your pet listings here</p>
      </div>
    </div>
    <div class="mb-8">
      <button id="add-listing-btn" class="bg-[#362550] text-white px-6 py-3 rounded-md flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Add New Listing
      </button>
    </div>
    <div id="pet-listings" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Pet listing cards will be dynamically inserted here -->
    </div>
  <div id="listing-modal" class="fixed inset-0 bg-black bg-opacity-30 items-center justify-center z-50 hidden">
    <div class="bg-white w-full max-w-md p-6 rounded-lg relative">
      <button id="close-modal-btn" class="absolute top-4 right-4 text-gray-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      <h2 class="text-2xl font-bold text-[#362550] mb-8 text-center">New Listing</h2>
      <form class="pet-form" id="pet-form">
        <input type="hidden" id="pet-id">
        <div class="grid grid-cols-2 gap-6 mb-6">
          <div>
            <label for="pet-name" class="block text-gray-700 mb-2">Name:</label>
            <input
              type="text"
              id="pet-name"
              placeholder="e.g. Felix"
              class="w-full p-2 border border-gray-200 rounded-md"
              required
            >
          </div>
          <div>
            <label for="pet-breed" class="block text-gray-700 mb-2">Breed:</label>
            <input
              type="text"
              id="pet-breed"
              class="w-full p-2 border border-gray-200 rounded-md"
              required
            >
          </div>
          <div>
            <label for="pet-age" class="block text-gray-700 mb-2">Age:</label>
            <input
              type="number"
              id="pet-age"
              class="w-full p-2 border border-gray-200 rounded-md"
              required
            >
          </div>
          <div>
            <label for="pet-size" class="block text-gray-700 mb-2">Size:</label>
            <input
              type="text"
              id="pet-size"
              class="w-full p-2 border border-gray-200 rounded-md"
              required
            >
          </div>
        </div>
        <div class="mb-6">
          <label for="pet-description" class="block text-gray-700 mb-2">Description:</label>
          <textarea
            id="pet-description"
            rows="5"
            class="w-full p-2 border border-gray-200 rounded-md"
            required
          ></textarea>
        </div>
        <div class="mb-6">
          <label for="pet-image-url" class="block text-sm font-medium text-gray-700">Image URL</label>
          <input type="url" id="pet-image-url" name="pet-image-url" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" placeholder="https://...">
        </div>        
        <div id="image-previews" class="grid grid-cols-3 gap-4 mb-8">
          <!-- Image previews will be dynamically inserted here -->
        </div>
        <div class="flex justify-center">
          <button
            type="submit"
            class="bg-[#362550] text-white px-8 py-3 rounded-md w-full">
            Publish
          </button>
        </div>
      </form>
      
    </div>
  </div>
  </main>
  <footer class="bg-gray-900 text-white px-20 py-8">
    <div class="container mx-auto px-4">
      <div class="flex flex-col md:flex-row justify-between">
        <div class="space-y-4 mb-6 md:mb-0">
          <a href="/contact" class="block hover:text-gray-300">Contact us</a>
          <a href="/about" class="block hover:text-gray-300">About</a>
          <a href="/faq" class="block hover:text-gray-300">FAQ</a>
        </div>
        <div class="flex justify-center space-x-6 mb-6 md:mb-0">
          <a href="#" class="text-white hover:text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
          </a>
          <a href="#" class="text-white hover:text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"/>
            </svg>
          </a>
          <a href="#" class="text-white hover:text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M4.98 3.5c0 1.381-1.11 2.5-2.48 2.5s-2.48-1.119-2.48-2.5c0-1.38 1.11-2.5 2.48-2.5s2.48 1.12 2.48 2.5zm.02 4.5h-5v16h5v-16zm7.982 0h-4.968v16h4.969v-8.399c0-4.67 6.029-5.052 6.029 0v8.399h4.988v-10.131c0-7.88-8.922-7.593-11.018-3.714v-2.155z"/>
            </svg>
          </a>
        </div>
        <div class="space-y-4">
          <a href="/privacy" class="block hover:text-gray-300">Privacy Policy</a>
          <a href="/terms" class="block hover:text-gray-300">Terms & Conditions</a>
        </div>
      </div>
    </div>
  </footer>
  <script type="module" src="/src/js/components/header.mjs"></script>
  <script type="module" src="/src/js/pages/auth/profile.mjs"></script>
</body>
</html>
