<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PETsome - All Pets</title>
  <link href="./src/style.css" rel="stylesheet">
  <script type="module" src="src/js/pages/listings.mjs"></script>
</head>
<body class="bg-white min-h-screen">
  <header class="bg-white px-20 py-14 shadow-sm">
    <div class="container mx-auto flex justify-between items-center">
      <div class="flex items-center">
        <div class="flex items-center">
          <img src="/assets/images/PetsomeLogo.png" width="381" height="160" alt="PETsome Logo" class="w-[381px] h-[160px]">
        </div>
      </div>
      <div class="space-x-4 auth-buttons">
        <a href="/login.html" class="inline-block px-6 py-2 bg-primary text-white rounded hover:underline transition">Login</a>
        <a href="/register.html" class="inline-block px-6 py-2 bg-primary text-white rounded hover:underline transition">Sign Up</a>
      </div>
    </div>
  </header>
  <div class="container mx-auto px-4 mt-4">
    <a href="/index.html" class="text-gray-700 inline-flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Back to Home Page
    </a>
  </div>
  <main class="container mx-auto py-8 px-4">
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-2xl font-bold">All Available Pets</h1>
    </div>
    
    <!-- Search and filter section -->
    <div class="mb-8 bg-gray-100 p-4 rounded-lg">
      <form id="search-form" class="flex flex-wrap gap-4">
        <div class="flex-grow">
          <input type="text" id="search-input" class="w-full px-4 py-2 border rounded" placeholder="Search pets...">
        </div>
        <div>
          <select id="sort-select" class="px-4 py-2 border rounded">
            <option value="created_desc">Newest first</option>
            <option value="created_asc">Oldest first</option>
            <option value="name_asc">Name A-Z</option>
            <option value="name_desc">Name Z-A</option>
          </select>
        </div>
        <button type="submit" class="px-4 py-2 bg-secondary text-white rounded">Search</button>
      </form>
      
      <!-- Filter buttons (optional) -->
      <div class="mt-4 flex flex-wrap gap-2">
        <span class="text-sm text-gray-700">Filter by:</span>
        <div class="space-x-2" data-filter-group="petType">
          <button data-filter="all" data-filter-group="petType" class="px-3 py-1 bg-purple-600 text-white rounded text-sm">All</button>
          <button data-filter="dog" data-filter-group="petType" class="px-3 py-1 bg-white text-gray-700 rounded text-sm">Dogs</button>
          <button data-filter="cat" data-filter-group="petType" class="px-3 py-1 bg-white text-gray-700 rounded text-sm">Cats</button>
          <button data-filter="other" data-filter-group="petType" class="px-3 py-1 bg-white text-gray-700 rounded text-sm">Other</button>
        </div>
      </div>
    </div>
    
    <div class="mb-4">
      <span id="result-count" class="text-gray-600">Searching for pets...</span>
    </div>
    
    <!-- Pet listings container -->
    <div id="pet-listings" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Pet cards will be loaded here by JavaScript -->
      <div class="animate-pulse bg-white rounded-md p-4">
        <div class="h-48 bg-gray-200 rounded mb-4"></div>
        <div class="h-6 bg-gray-200 rounded w-3/4 mb-2"></div>
        <div class="h-4 bg-gray-200 rounded w-1/2 mb-4"></div>
        <div class="h-10 bg-gray-200 rounded w-1/3 mx-auto"></div>
      </div>
      <div class="animate-pulse bg-white rounded-md p-4">
        <div class="h-48 bg-gray-200 rounded mb-4"></div>
        <div class="h-6 bg-gray-200 rounded w-3/4 mb-2"></div>
        <div class="h-4 bg-gray-200 rounded w-1/2 mb-4"></div>
        <div class="h-10 bg-gray-200 rounded w-1/3 mx-auto"></div>
      </div>
      <div class="animate-pulse bg-white rounded-md p-4">
        <div class="h-48 bg-gray-200 rounded mb-4"></div>
        <div class="h-6 bg-gray-200 rounded w-3/4 mb-2"></div>
        <div class="h-4 bg-gray-200 rounded w-1/2 mb-4"></div>
        <div class="h-10 bg-gray-200 rounded w-1/3 mx-auto"></div>
      </div>
    </div>
    
    <!-- Pagination will be added here by JavaScript -->
  </main>
  <footer class="bg-gray-900 text-white px-20 py-8">
    <div class="container mx-auto px-4">
      <div class="flex flex-col md:flex-row justify-between">
        <div class="space-y-4 mb-6 md:mb-0">
          <a href="/contact" class="block hover:text-gray-300">Contact us</a>
          <a href="/about" class="block hover:text-gray-300">About</a>
          <a href="/faq" class="block hover:text-gray-300">FAQ</a>
        </div>
        <div class="flex justify-center space-x-6 mb-6 md:mb-0">
          <a href="#" class="text-white hover:text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
          </a>
          <a href="#" class="text-white hover:text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"/>
            </svg>
          </a>
          <a href="#" class="text-white hover:text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M4.98 3.5c0 1.381-1.11 2.5-2.48 2.5s-2.48-1.119-2.48-2.5c0-1.38 1.11-2.5 2.48-2.5s2.48 1.12 2.48 2.5zm.02 4.5h-5v16h5v-16zm7.982 0h-4.968v16h4.969v-8.399c0-4.67 6.029-5.052 6.029 0v8.399h4.988v-10.131c0-7.88-8.922-7.593-11.018-3.714v-2.155z"/>
            </svg>
          </a>
        </div>
        <div class="space-y-4">
          <a href="/privacy" class="block hover:text-gray-300">Privacy Policy</a>
          <a href="/terms" class="block hover:text-gray-300">Terms & Conditions</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
